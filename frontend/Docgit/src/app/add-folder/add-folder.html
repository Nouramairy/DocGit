<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="material-icons-outlined modal-icon">create_new_folder</span>
      <h2 class="modal-title">New Folder</h2>
    </div>

    <div class="modal-body">
      <label class="input-label" for="folderName">Folder name</label>
      <input
        #nameInput
        id="folderName"
        type="text"
        class="text-input"
        placeholder="Enter folder name..."
        [value]="folderName()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        autocomplete="off"
      />
    </div>

    <div class="modal-footer">
      <button class="modal-btn cancel-btn" (click)="cancel.emit()">Cancel</button>
      <button
        class="modal-btn create-btn"
        [class.disabled]="!folderName().trim()"
        (click)="onSubmit()"
      >
        <span class="material-icons-outlined">add</span>
        Create
      </button>
    </div>
  </div>
</div>
