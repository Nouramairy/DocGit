<div class="sidebar-content">
  <div class="sidebar-header">
    <span class="sidebar-title">Explorer</span>
    <div class="sidebar-actions">
      <button class="sidebar-action-btn" (click)="createFile(null)" title="New document">
        <span class="material-icons-outlined">note_add</span>
      </button>
      <button class="sidebar-action-btn" (click)="addFolderClick.emit()" title="New folder">
        <span class="material-icons-outlined">create_new_folder</span>
      </button>
      <button class="sidebar-action-btn" (click)="triggerUpload()" title="Upload file">
        <span class="material-icons-outlined">upload_file</span>
      </button>
    </div>
  </div>

  <div class="file-tree">
    @for (node of flatTree(); track node.file.id) {
      @if (node.file.type === 'folder') {
        <div
          class="tree-row"
          role="treeitem"
          tabindex="0"
          [class.active]="isActive(node.file)"
          [style.padding-left]="getIndentPx(node.depth, false)"
          (click)="toggleFolder(node.file.id)"
          (keydown.enter)="toggleFolder(node.file.id)"
          [attr.aria-expanded]="isFolderExpanded(node.file.id)"
        >
          <span class="material-icons-outlined chevron" [class.expanded]="isFolderExpanded(node.file.id)">
            chevron_right
          </span>
          <span class="material-icons-outlined file-icon folder-icon">
            {{ getFileIcon(node.file) }}
          </span>
          <span class="file-name">{{ node.file.name }}</span>
          <div class="tree-actions" (click)="$event.stopPropagation()">
            <button class="tree-action-btn" (click)="createFile(node.file.id)" title="New file">
              <span class="material-icons-outlined">note_add</span>
            </button>
            <button class="tree-action-btn" (click)="requestSubFolder(node.file)" title="New sub-folder">
              <span class="material-icons-outlined">create_new_folder</span>
            </button>
            <button class="tree-action-btn delete-btn" (click)="deleteItem.emit(node.file)" title="Delete folder">
              <span class="material-icons-outlined">delete_outline</span>
            </button>
          </div>
        </div>
      } @else {
        <div
          class="tree-row"
          role="treeitem"
          tabindex="0"
          [class.active]="isActive(node.file)"
          [style.padding-left]="getIndentPx(node.depth, true)"
          (click)="selectFile(node.file)"
          (keydown.enter)="selectFile(node.file)"
        >
          <span class="material-icons-outlined file-icon doc-icon">
            {{ getFileIcon(node.file) }}
          </span>
          <span class="file-name">{{ node.file.name }}</span>
          <div class="tree-actions" (click)="$event.stopPropagation()">
            <button class="tree-action-btn delete-btn" (click)="deleteItem.emit(node.file)" title="Delete file">
              <span class="material-icons-outlined">delete_outline</span>
            </button>
          </div>
        </div>
      }
    }
  </div>

  <div class="sidebar-footer">
    <div class="storage-info">
      <span class="material-icons-outlined">cloud_done</span>
      <span>Changes save to server</span>
    </div>
  </div>
</div>
