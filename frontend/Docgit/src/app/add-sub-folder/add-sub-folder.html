<div class="modal-overlay" (click)="onOverlayClick($event)">
  <div class="modal-dialog">
    <div class="modal-header">
      <span class="material-icons-outlined modal-icon">snippet_folder</span>
      <div class="modal-header-text">
        <h2 class="modal-title">New Sub-folder</h2>
        <span class="modal-parent-path">
          <span class="material-icons-outlined parent-icon">folder</span>
          {{ parentFolderName() }}
        </span>
      </div>
    </div>

    <div class="modal-body">
      <label class="input-label" for="subFolderName">Sub-folder name</label>
      <input
        #nameInput
        id="subFolderName"
        type="text"
        class="text-input"
        placeholder="Enter sub-folder name..."
        [value]="folderName()"
        (input)="onInput($event)"
        (keydown)="onKeydown($event)"
        autocomplete="off"
      />
    </div>

    <div class="modal-footer">
      <button class="modal-btn cancel-btn" (click)="cancel.emit()">Cancel</button>
      <button
        class="modal-btn create-btn"
        [class.disabled]="!folderName().trim()"
        (click)="onSubmit()"
      >
        <span class="material-icons-outlined">add</span>
        Create
      </button>
    </div>
  </div>
</div>
