@if (isAuthenticated()) {
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" (click)="toggleSidebar()" title="Toggle sidebar">
          <span class="material-icons-outlined">menu</span>
        </button>
        <div class="logo">
          <span class="material-icons-outlined logo-icon">description</span>
          <span class="logo-text">{{ title() }}</span>
        </div>
      </div>

      <div class="topbar-center">
        <app-sreach-bar (searchChange)="onSearch($event)" />
      </div>

      <div class="topbar-right">
        <button class="icon-btn" (click)="showDeletedItems.set(true)" title="Deleted items">
          <span class="material-icons-outlined">delete_outline</span>
        </button>
        <button class="icon-btn" (click)="showSettings.set(true)" title="Settings">
          <span class="material-icons-outlined">settings</span>
        </button>
        <div class="avatar-wrapper">
          <button class="avatar" (click)="toggleAccount(); $event.stopPropagation()">
            <span class="avatar-initials">JD</span>
          </button>
          @if (showAccount()) {
            <app-account
              (logOut)="onLogOut()"
              (close)="showAccount.set(false)"
            />
          }
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">
      <app-side-bar
        [files]="files()"
        [activeFile]="activeFile()"
        [searchQuery]="searchQuery()"
        (fileSelect)="onFileSelect($event)"
        (addFolderClick)="showAddFolder.set(true)"
        (addFileClick)="onAddFile($event)"
        (addSubFolderClick)="onRequestSubFolder($event)"
        (deleteItem)="onDeleteItem($event)"
      />
      </aside>

      <!-- Editor Area -->
      <main class="editor-area">
        <app-editor
          [file]="activeFile()"
          (contentChange)="onContentChange($event)"
          (shareClick)="showCollaborators.set(true)"
        />
      </main>
    </div>
  </div>

  <!-- Modals / Overlays -->
  @if (showAddFolder()) {
    <app-add-folder
      (create)="onAddFolder($event)"
      (cancel)="showAddFolder.set(false)"
    />
  }

  @if (showDeletedItems()) {
    <app-deleted-items
      [items]="deletedFiles()"
      (close)="showDeletedItems.set(false)"
      (restore)="onRestoreItem($event)"
      (permanentDelete)="onPermanentDelete($event)"
      (emptyTrash)="onEmptyTrash()"
    />
  }

  @if (showAddSubFolder() && subFolderParent()) {
    <app-add-sub-folder
      [parentFolderName]="subFolderParent()!.name"
      [parentFolderId]="subFolderParent()!.id"
      (create)="onAddSubFolder($event)"
      (cancel)="showAddSubFolder.set(false)"
    />
  }

  @if (showCollaborators()) {
    <app-collaborator-panel
      (close)="showCollaborators.set(false)"
    />
  }

  @if (showSettings()) {
    <app-settings-panel
      (close)="showSettings.set(false)"
    />
  }
} @else {
  <app-log-in (loginSuccess)="onLoginSuccess($event)" />
}
