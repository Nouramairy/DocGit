@if (isAuthenticated()) {
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" (click)="toggleSidebar()" title="Toggle sidebar">
          <span class="material-icons-outlined">menu</span>
        </button>
        <div class="logo">
          <span class="material-icons-outlined logo-icon">description</span>
          <span class="logo-text">{{ title() }}</span>
        </div>
      </div>

      <div class="topbar-center">
        <app-sreach-bar (searchChange)="onSearch($event)" />
      </div>

      <div class="topbar-right">
        <button class="icon-btn trash-btn" (click)="openDeletedItems()" title="Deleted items">
          <span class="material-icons-outlined">delete</span>
        </button>
        <button class="icon-btn" (click)="showSettings.set(true)" title="Settings">
          <span class="material-icons-outlined">settings</span>
        </button>
        <div class="avatar-wrapper">
          <button class="avatar" (click)="toggleAccount(); $event.stopPropagation()">
            <span class="avatar-initials">{{ avatarInitials() }}</span>
          </button>
          @if (showAccount()) {
            <app-account
              [documentCount]="documentCount()"
              [displayName]="userName()"
              [email]="userEmail()"
              [initials]="avatarInitials()"
              (logOut)="onLogOut()"
              (close)="showAccount.set(false)"
            />
          }
        </div>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar" [class.collapsed]="sidebarCollapsed()">
        <app-side-bar
          [files]="files()"
          [activeFile]="activeFile()"
          [searchQuery]="searchQuery()"
          (fileSelect)="onFileSelect($event)"
          (addFolderClick)="showAddFolder.set(true)"
          (addFileClick)="onAddFile($event)"
          (addSubFolderClick)="onRequestSubFolder($event)"
          (deleteItem)="onDeleteItem($event)"
          (uploadFile)="onImportFile($event)"
        />
      </aside>

      <main class="editor-area">
        @if (isTreeLoading()) {
          <div class="tree-loading-banner">Loading your files…</div>
        }
        <app-editor
          [file]="activeFile()"
          [contentSyncRev]="editorContentSyncRev()"
          [versionCount]="editorVersionCount()"
          [fileHistory]="fileHistory()"
          [saveInFlight]="saveInFlight()"
          [restoreInFlight]="restoreInFlight()"
          (contentChange)="onContentChange($event)"
          (saveClick)="onSaveNow()"
          (restoreVersion)="onRestoreHistoryVersion($event)"
          (newDocumentClick)="onAddFile(null)"
          (newFolderClick)="showAddFolder.set(true)"
          (importFile)="onImportFile($event)"
        />
      </main>
    </div>
  </div>

  @if (showAddFolder()) {
    <app-add-folder
      (create)="onAddFolder($event)"
      (cancel)="showAddFolder.set(false)"
    />
  }

  @if (showAddFile()) {
    <app-add-folder
      [mode]="'file'"
      (create)="onCreateFile($event)"
      (cancel)="showAddFile.set(false)"
    />
  }

  @if (showDeletedItems()) {
    <app-deleted-items
      [items]="deletedFiles()"
      (close)="showDeletedItems.set(false)"
      (restore)="onRestoreItem($event)"
      (permanentDelete)="onPermanentDelete($event)"
      (emptyTrash)="onEmptyTrash()"
    />
  }

  @if (showAddSubFolder() && subFolderParent()) {
    <app-add-sub-folder
      [parentFolderName]="subFolderParent()!.name"
      [parentFolderId]="subFolderParent()!.id"
      (create)="onAddSubFolder($event)"
      (cancel)="showAddSubFolder.set(false)"
    />
  }

  @if (showSettings()) {
    <app-settings-panel (close)="showSettings.set(false)" />
  }
} @else {
  <app-log-in (loginSuccess)="onLoginSuccess($event)" />
}
