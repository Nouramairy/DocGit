<div class="panel-overlay" (click)="onOverlayClick($event)">
  <div class="panel-slide">
    <div class="panel-header">
      <div class="panel-title-row">
        <span class="material-icons-outlined panel-icon">settings</span>
        <h2 class="panel-title">Settings</h2>
      </div>
      <button class="close-btn" (click)="close.emit()">
        <span class="material-icons-outlined">close</span>
      </button>
    </div>

    <!-- Settings Content -->
    <div class="panel-body">
      @for (setting of generalSettings(); track setting.id) {
        <div class="setting-row">
          <div class="setting-info">
            <span class="material-icons-outlined setting-icon">{{ setting.icon }}</span>
            <div class="setting-text">
              <span class="setting-label">{{ setting.label }}</span>
              <span class="setting-desc">{{ setting.description }}</span>
            </div>
          </div>
          <button
            class="toggle"
            [class.on]="setting.enabled"
            (click)="toggleSetting('generalSettings', setting.id)"
          >
            <span class="toggle-knob"></span>
          </button>
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="panel-footer">
      <span class="version-text">DocGit v0.1.0</span>
    </div>
  </div>
</div>
